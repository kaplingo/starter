const view=document.getElementById('view');let idx=0,score=0,streak=0,bestStreak=0,correct=0,wrongAnswers=[],answered=false,seconds=0,timer=null,lock=false,muted=false,boost={fifty:1,extra:1,double:1},doubleActive=false,eliminated=[],sessionStart=0;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>a.map(x=>({x,k:Math.random()})).sort((a,b)=>a.k-b.k).map(v=>v.x);
let audio;function tone(freq=550,duration=.13,kind='sine',gain=.07){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=kind;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function sfx(type){if(type==='good'){tone(650,.13);setTimeout(()=>tone(880,.22),100);setTimeout(()=>tone(1100,.22),200)}else if(type==='bad'){tone(270,.3,'sawtooth',.035);setTimeout(()=>tone(190,.3,'sawtooth',.03),140)}else if(type==='click'){tone(440,.07,'triangle',.03)}else if(type==='boost'){tone(910,.18);setTimeout(()=>tone(1200,.16),110)}else if(type==='win'){[530,670,800,1050].forEach((x,i)=>setTimeout(()=>tone(x,.33),i*130))}}
function speak(text){if(muted||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replaceAll('→',', '));u.lang='en-US';u.rate=.82;u.pitch=1.16;window.speechSynthesis.speak(u)}
function confetti(n=50){const root=document.getElementById('stars');root.innerHTML='';const colors=['#f64ca5','#ffd650','#78e6ff','#abf575','#9f79ff'];for(let i=0;i<n;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.top=-Math.random()*250+'px';e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*.6+'s';root.append(e)}setTimeout(()=>root.innerHTML='',2500)}
function start(){clearTimeout(advanceTimer);sfx('click');gameQuestions=shuffle(QUESTIONS);idx=0;score=0;streak=0;bestStreak=0;correct=0;wrongAnswers=[];boost={fifty:1,extra:1,double:1};sessionStart=Date.now();renderQuestion()}
function home(){clearInterval(timer);clearTimeout(advanceTimer);view.innerHTML=`<section class="hero page"><div class="mascot" aria-hidden="true">🚀⭐✨</div><h1>Ready for a <span class="gradient">word adventure?</span></h1><div class="startrow"><button id="play" class="btn primary">🎮 LET'S PLAY!</button></div><div class="meta"><span>🎯 20 questions</span><span>🖼️ Picture words</span><span>⚡ Power-ups</span><span>🏆 Streak rewards</span></div></section>`;document.getElementById('play').onclick=start}

function images(q){
 if(q.type==='spell')return `<div class="spelling-area"><div class="picture solo" title="Picture"><div class="emoji">${ICON[q.words[0]]}</div></div><div class="spelling-puzzle" aria-label="Complete the word">${escapeHTML(q.puzzle)}</div></div>`;
 const arr=q.words;
 return arr.map((w,j)=>`<div class="picture ${q.type==='single'?'solo':''}" title="Picture ${j+1}"><div class="emoji" aria-label="Illustration">${ICON[w]}</div>${q.type==='order'?`<div class="picnum">${j+1}</div>`:''}</div>`).join('')
}
function renderQuestion(){clearInterval(timer);answered=false;lock=false;doubleActive=false;eliminated=[];const q=gameQuestions[idx];seconds=q.time;const options=shuffle(q.options);q.currentOptions=options;let title=({single:'What is this?',order:'Which is the correct order?',spell:'Which letter is missing?',missing:'Which word is missing?'})[q.type];let instruction=({single:'',order:'LEFT ➜ RIGHT',spell:'Complete the word!',missing:'Which word is NOT in the pictures?'})[q.type];
view.innerHTML=`<section class="page"><div class="hud"><div class="stat">🚀 QUESTION<b>${idx+1} / ${gameQuestions.length}</b></div><div class="stat">⭐ SCORE<b id="score">${score.toLocaleString()}</b></div><div class="stat">🔥 STREAK<b id="streak">${streak}</b></div></div><div class="progress"><span style="width:${idx/gameQuestions.length*100}%"></span></div><div class="panel"><div class="questionhead"><span class="qtag">${({single:'🔎 PICTURE POWER',order:'🧩 ORDER QUEST',spell:'✏️ LETTER POWER',missing:'🔍 MISSING WORD'})[q.type]}</span><span class="timer" id="timer">⏳ ${seconds}s</span></div><h2>${title}</h2><div class="instruction">${instruction}</div><div class="pictures">${images(q)}</div><div class="choices" id="choices">${options.map((o,i)=>`<button class="choice" data-option="${i}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(o)}</span></button>`).join('')}</div><div id="feedback"></div></div><div class="boosters"><button class="booster" data-boost="fifty" ${boost.fifty?'':'disabled'}>🪄 50/50 ${boost.fifty?'':'✓'}</button><button class="booster" data-boost="extra" ${boost.extra?'':'disabled'}>⏰ +15 sec ${boost.extra?'':'✓'}</button><button class="booster" data-boost="double" ${boost.double?'':'disabled'}>⚡ 2× Points ${boost.double?'':'✓'}</button></div><div class="footerline"><span class="small">🎧 Sound on for pronunciation</span><button class="iconbtn" id="speak" title="Read question aloud" aria-label="Read question aloud">🗣️</button></div></section>`;
view.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer(options[Number(b.dataset.option)]));view.querySelectorAll('[data-boost]').forEach(b=>b.onclick=()=>useBoost(b.dataset.boost));document.getElementById('speak').onclick=()=>speak(title);timer=setInterval(()=>{if(answered)return;seconds--;const t=document.getElementById('timer');if(t){t.textContent=`⏳ ${Math.max(0,seconds)}s`;t.classList.toggle('danger',seconds<=7)}if(seconds<=0)answer(null)},1000)}
function useBoost(type){if(answered||!boost[type])return;sfx('boost');boost[type]=0;let q=gameQuestions[idx];if(type==='extra'){seconds+=15}else if(type==='double'){doubleActive=true}else if(type==='fifty'){const wrong=shuffle(q.currentOptions.filter(x=>x!==q.answer));eliminated=wrong.slice(0,2);view.querySelectorAll('[data-option]').forEach((b,i)=>{if(eliminated.includes(q.currentOptions[i])){b.classList.add('hidden');b.disabled=true}})}view.querySelector(`[data-boost="${type}"]`).disabled=true;view.querySelector(`[data-boost="${type}"]`).textContent+=' ✓'}
function answer(chosen){if(answered)return;answered=true;clearInterval(timer);const q=gameQuestions[idx],ok=chosen===q.answer;if(ok){correct++;streak++;bestStreak=Math.max(bestStreak,streak);let pts=100+Math.max(0,seconds)*4+Math.min(streak-1,10)*25;if(doubleActive)pts*=2;score+=pts;sfx('good');if(streak%3===0)confetti(26)}else{streak=0;wrongAnswers.push({number:idx+1,correct:q.answer});sfx('bad')}
view.querySelectorAll('[data-option]').forEach((b,i)=>{b.disabled=true;let value=q.currentOptions[i];if(value===q.answer)b.classList.add('correct');else if(value===chosen)b.classList.add('wrong')});document.getElementById('score').textContent=score.toLocaleString();document.getElementById('streak').textContent=streak;document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?`🌟 AMAZING! +${score>0?'':0}${''} points!`:`${chosen===null?'⌛ Time is up!':'💪 Nice try!'} Correct answer: ${escapeHTML(q.answer)}`}</div>`;if(ok){const f=document.querySelector('.feedback');let earned=100+Math.max(0,seconds)*4+Math.min(streak-1,10)*25;f.textContent=`🌟 AMAZING! +${earned*(doubleActive?2:1)} points! ${streak>=3?'🔥 '+streak+' streak!':''}`}
const footer=view.querySelector('.footerline');footer.innerHTML=`<span class="autonext">${ok?'🌟 Awesome!':'💫 Keep trying!'} &nbsp; Next question in <b id="countdown">2</b>…</span>`;let countdown=2;const tick=()=>{if(!answered)return;countdown--;const el=document.getElementById('countdown');if(el)el.textContent=Math.max(0,countdown);if(countdown<=0){next()}else advanceTimer=setTimeout(tick,1000)};advanceTimer=setTimeout(tick,1200)}
function next(){clearTimeout(advanceTimer);sfx('click');idx++;if(idx>=gameQuestions.length)end();else renderQuestion()}
function end(){clearTimeout(advanceTimer);clearInterval(timer);sfx('win');confetti(110);let old=0;try{old=Number(localStorage.getItem('wordrocket_best')||0);if(score>old)localStorage.setItem('wordrocket_best',score)}catch(e){}let best=Math.max(old,score),rank=correct>=18?'SUPERSTAR!':correct>=14?'WORD HERO!':correct>=9?'GREAT EXPLORER!':'BRAVE BEGINNER!';view.innerHTML=`<section class="hero page"><span class="eyebrow">MISSION COMPLETE!</span><div class="endstars">🏆🌟🚀</div><h1 class="gradient">${rank}</h1><p class="lead">You finished all 20 vocabulary challenges!</p><div class="scorebig">${score.toLocaleString()}</div><div class="lead">TOTAL POINTS</div><div class="endgrid"><div>✅ Correct<b>${correct}/20</b></div><div>🔥 Best streak<b>${bestStreak}</b></div><div>🏅 Personal best<b>${best.toLocaleString()}</b></div></div><div class="startrow"><button class="btn primary" id="again">🔄 PLAY AGAIN</button><button class="btn secondary" id="reviewbtn">📖 REVIEW WORDS</button></div><div class="review" id="review" style="display:none">${wrongAnswers.length?wrongAnswers.map(w=>`<div class="reviewitem">Question ${w.number}: <b>${escapeHTML(w.correct)}</b></div>`).join(''):'⭐ Perfect! No wrong answers!'}</div><p style="color:#9299b3;font-size:13px">Made for Grade 2 • picture vocabulary • works offline</p></section>`;document.getElementById('again').onclick=start;document.getElementById('reviewbtn').onclick=()=>{const r=document.getElementById('review');r.style.display=r.style.display==='none'?'block':'none'}}
document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇':'🔊';if(!muted)sfx('click')};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else document.exitFullscreen?.()};window.addEventListener('keydown',e=>{if(['1','2','3','4'].includes(e.key)&&!answered&&gameQuestions[idx]){const b=view.querySelectorAll('[data-option]')[Number(e.key)-1];if(b&&!b.disabled)b.click()}if(e.key==='Enter'&&answered)next()});

function fitViewport(){
 const app=document.querySelector('.app');
 if(!app)return;
 app.style.transform='none';
 const natural=app.scrollHeight;
 const available=window.innerHeight-4;
 const factor=Math.min(1,available/Math.max(1,natural));
 app.style.transform=`scale(${factor})`;
}
const fitObserver=new MutationObserver(()=>requestAnimationFrame(fitViewport));
fitObserver.observe(document.getElementById('view'),{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
window.addEventListener('resize',()=>requestAnimationFrame(fitViewport));
window.addEventListener('orientationchange',()=>setTimeout(fitViewport,180));

// Twenty playable questions: 8 picture, 6 order, 3 spelling and 3 missing-picture.
console.assert(QUESTIONS.length===20,'Question count mismatch');home();requestAnimationFrame(fitViewport);
</script></body></html>
